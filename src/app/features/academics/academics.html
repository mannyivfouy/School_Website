<!-- HEADER -->
<div class="w-full pt-8 space-y-6 animate__animated animate__fadeIn">
  <div class="text-center px-4">
    <h1 class="text-2xl sm:text-3xl font-bold text-gray-700">
      {{ 'ACADEMICS.TITLE' | translate }}
    </h1>

    <p class="text-base sm:text-lg text-gray-600 max-w-4xl mx-auto">
      <!-- {{ 'INTERN.DESCRIPTION' | translate }} -->
    </p>
  </div>
</div>

<div class="space-y-10 sm:space-y-14 animate__animated animate-fade-up">
  <div *ngFor="let group of groupedDegrees">

    <h1 class="text-xl sm:text-2xl font-bold text-gray-700 mb-2">
      {{ group.type }}
    </h1>

    <hr class="h-[3px] w-24 sm:w-30 bg-[#00a76d] border-0 mb-6" />

    <div
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6"
    >
      <app-major-card
        *ngFor="let major of group.majors"
        [major]="major"
        (learnMore)="openMajor(major, group.type)"
      ></app-major-card>
    </div>

  </div>
</div>

<!-- Modal -->
<app-major-modal
  *ngIf="selectedCard"
  [card]="selectedCard"
  (close)="closeModal()"
></app-major-modal>
