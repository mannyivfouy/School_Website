<div
  class="group overflow-hidden rounded-3xl shadow-lg hover:-translate-y-1 transition-all duration-300 card-shadow cursor-pointer bg-white h-full flex flex-col"
  (click)="learnMore.emit(major.id)"
>
  <!-- TOP -->
  <div class="relative h-52 sm:h-60 overflow-hidden">
    <img
      *ngIf="major.image"
      [src]="major.image"
      [alt]="major.name"
      class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
    />
  </div>

  <!-- BOTTOM -->
  <div class="p-4 sm:p-5 text-gray-700 flex flex-col flex-grow">
    <h3 class="text-base sm:text-lg font-bold line-clamp-2">
      {{ major.name }}
    </h3>

    <div class="border-t-2 border-[#00a76d] my-3"></div>

    <div class="mt-auto">
      <div
        (click)="learnMore.emit(major.id)"
        class="flex items-center gap-1 text-[#00a76d] font-medium cursor-pointer hover:gap-2 transition-all"
      >
        <span>Course Detail</span>

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M7 7h10v10" />
          <path d="M7 17 17 7" />
        </svg>
      </div>
    </div>
  </div>
</div>
