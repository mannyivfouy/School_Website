<div class="w-full pt-6 sm:pt-8 space-y-6 animate__animated animate__fadeIn">
  <!-- Section Title -->
  <div class="text-center px-4">
    <h1 class="text-2xl sm:text-3xl font-bold text-gray-700">
      {{ 'FACILITIES.TITLE' | translate }}
    </h1>

    <p class="text-gray-600 text-base sm:text-lg max-w-3xl mx-auto mt-2">
      {{ 'FACILITIES.SUBTITLE' | translate }}
    </p>
  </div>

  @for (room of rooms; track $index; let i = $index) {
    <div
      class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-center bg-white rounded-3xl shadow-md p-4 lg:p-6 overflow-hidden"
    >
      <!-- IMAGE -->
      <div [class.lg:order-2]="i % 2 !== 0">
        <img
          [src]="room.IMAGE"
          [alt]="room.TITLE"
          class="w-full h-56 sm:h-72 lg:h-80 object-cover rounded-xl transition-transform duration-500 hover:scale-105"
        />
      </div>

      <!-- TEXT -->
      <div class="space-y-3" [class.lg:order-1]="i % 2 !== 0">
        <h2 class="text-xl sm:text-2xl font-bold text-gray-700">
          {{ room.TITLE }}
        </h2>

        <p class="text-gray-600 text-base sm:text-lg leading-relaxed">
          {{ room.DESCRIPTION }}
        </p>
      </div>
    </div>
  }
</div>
